<form [formRoot]="quizSettingsForm">
  <aside class="settings-panel">
    <div class="panel-title">
      <span class="settings-icon" aria-hidden="true">+</span>
      <h2>Quiz Settings</h2>
    </div>

    <label>
      <span>Quiz Title</span>
      <input type="text" [formField]="quizSettingsForm.title" />
    </label>

    <label>
      <span>Classroom</span>
      <select [formField]="quizSettingsForm.classroomId">
        @for (classroom of classrooms(); track classroom.id) {
          <option [value]="classroom.id">{{ classroom.classroomTitle }}</option>
        }

        @if (!classrooms().length) {
          <option value="">No classrooms yet</option>
        }
      </select>
    </label>

    @if (mode() === 'upload') {
      <app-question-type-settings [allocations]="allocations()" (allocationsChange)="allocations.set($event)" />
      @if (allocationError()) {
        <p role="alert" class="allocation-error">{{ allocationError() }}</p>
      }

      <label>
        <span>Description</span>
        <input type="text" [formField]="quizSettingsForm.description" />
      </label>

      <p class="hint">Leave blank to cover all topics</p>
    }

    @if (mode() === 'review') {
      <div class="field-grid">
        <label>
          <span>Time Limit (min)</span>
          <input type="number" [formField]="quizSettingsForm.timeLimit" />
        </label>
        <label>
          <span>Passing Score %</span>
          <input type="number" [formField]="quizSettingsForm.passingScore" />
        </label>
      </div>

      <label class="toggle-row">
        <span>
          Show Results
          <small>Students can see score after submit</small>
        </span>
        <input type="checkbox" [formField]="quizSettingsForm.autoReleaseScore" />
      </label>
    }
  </aside>
</form>
