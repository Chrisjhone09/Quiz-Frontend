<form [formRoot]="resetPasswordForm" class="auth-form">
	<h2>Create a new password</h2>

	<label class="field full">
		Email
		<input type="email" placeholder="you@school.edu" [formField]="resetPasswordForm.email" />
	</label>

	<label class="field full">
		New password
		<input type="password" placeholder="New password" [formField]="resetPasswordForm.newPassword" />
	</label>

	<label class="field full">
		Confirm new password
		<input type="password" placeholder="Confirm new password" [formField]="resetPasswordForm.confirmNewPassword" />
	</label>

	<div class="actions">
		<button type="submit" class="primary">Reset password</button>
	</div>

	<p class="muted"><a href="/login">Back to sign in</a></p>
</form>
