<section class="auth-shell">
	<div class="auth-intro">
		<p class="eyebrow">Password recovery</p>
		<h1>Get back to learning.</h1>
		<p>Enter the email address on your account. We'll send a six-digit code that expires in 10 minutes.</p>
	</div>
	<form [formRoot]="forpasswordForm" class="auth-form">
		<label class="field">
			<span>Email address</span>
			<input type="email" placeholder="you@school.edu" [formField]="forpasswordForm.email" />
		</label>
		@if (forpasswordForm.email().invalid()) { <p class="error">Please enter a valid email address.</p> }
		@if (errorMessage()) { <p class="banner banner-error">{{ errorMessage() }}</p> }
		<button type="submit" class="primary" [disabled]="submitting()">{{ submitting() ? 'Sending code…' : 'Send verification code' }}</button>
		<a class="back-link" routerLink="/login">Back to sign in</a>
	</form>
</section>
